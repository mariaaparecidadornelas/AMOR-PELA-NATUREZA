<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Amor pela Natureza</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <nav class="navbar">

            <h1>🌿 Amor pela Natureza</h1>

            <ul>
                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="sobre.html">Sobre</a>
                </li>

                <li>
                    <a href="servicos.html">Serviços</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>

        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <section class="pagina contato">

            <h2>Entre em contato</h2>

            <p>
                Quer saber mais sobre nossos projetos ou contribuir
                com a preservação da natureza? Envie uma mensagem!
            </p>


            <!-- FORMULÁRIO -->
            <form id="formContato">

                <!-- NOME -->
                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                >


                <!-- E-MAIL -->
                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                >


                <!-- MENSAGEM -->
                <label for="mensagem">
                    Mensagem
                </label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    placeholder="Digite sua mensagem"
                ></textarea>


                <!-- BOTÃO -->
                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <p>
            &copy; 2026 Amor pela Natureza -
            Todos os direitos reservados.
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>

</html>
