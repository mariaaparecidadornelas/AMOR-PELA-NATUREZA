<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Amor pela Natureza</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <h1>🌿 Amor pela Natureza</h1>

            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>

        </nav>
    </header>

    <main>

        <section class="pagina contato">

            <h2>Entre em contato</h2>

            <p>
                Quer saber mais sobre nossos projetos ou contribuir
                com a preservação da natureza? Envie uma mensagem!
            </p>

            <form action="#" method="post">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="mensagem">Mensagem</label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    placeholder="Digite sua mensagem"
                    required
                ></textarea>

                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Amor pela Natureza - Todos os direitos reservados.
        </p>
    </footer>

</body>
